<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGOS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>

<body>

    <div id="map-page" style="display:flex;"> 
        <div class="navbar">
            <div class="navbar-brand">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.6">
                    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.4" fill="#22d3ee" stroke="none"/>
                </svg>
                <span class="brand-name">ARGOS</span>
            </div>
            <div class="navbar-tabs">
                <button class="tab active" onclick="openTab('map', event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-13a7 7 0 1 0-14 0c0 5.42 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
                    Mapa
                </button>
                <button class="tab" onclick="openTab('analise', event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="20" y1="20" x2="20" y2="15"/></svg>
                    Análise Gráfica
                </button>
                <button class="tab" onclick="openTab('relatorios', event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>
                    Relatórios
                </button>
                <button class="tab" onclick="openTab('previsao', event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 19a4.5 4.5 0 0 1-.4-8.98A5.5 5.5 0 0 1 16.9 8.5 4.5 4.5 0 0 1 17.5 19h-11z"/></svg>
                    Previsão
                </button>
            </div>
            <div class="navbar-status">
                <span class="status-dot"></span>
                <span>Sistema Online</span>
            </div>
        </div>

        <div id="map" class="content active-content">
            <div id="mapa-regiao"></div>
            <div id="painel-estacao" class="painel-estacao">
                <div class="painel-estacao-header">
                    <h2 id="titulo-estacao">Estação</h2>
                    <button id="fechar-painel-estacao" class="fechar-painel" type="button" aria-label="Fechar informações">&times;</button>
                </div>
                <div class="estacao-leituras">
                    <p><span>Temperatura</span><strong id="temperatura-estacao">--</strong></p>
                    <p><span>Umidade</span><strong id="umidade-estacao">--</strong></p>
                    <p><span>Pluviometria</span><strong id="pluviometria-estacao">--</strong></p>
                    <p><span>Nível do rio</span><strong id="nivel-rio-estacao">--</strong></p>
                </div>
                <div class="estacao-alertas">
                    <div class="alertas-titulo"><span>Alertas</span><strong id="alertas-estacao">0</strong></div>
                    <div id="lista-alertas">Nenhum alerta no momento.</div>
                </div>
            </div>
        </div>

        <div id="analise" class="content">
            <h1>Análise Gráfica</h1>
            <div class="analysis-container">
                <div class="analysis-sidebar">
                    <h2>Variáveis</h2>
                    <label><input type="checkbox" checked onchange="toggleDataset(0)"> Temperatura</label>
                    <label><input type="checkbox" checked onchange="toggleDataset(1)"> Umidade</label>
                    <label><input type="checkbox" checked onchange="toggleDataset(2)"> Pluviometria</label>
                    <label><input type="checkbox" checked onchange="toggleDataset(3)"> Nível do Rio</label>
                    <div class="chart-controls">
                        <button class="chart-btn" onclick="resetChartZoom()">Reset Zoom</button>
                    </div>
                </div>

                <div class="analysis-chart">
                    <canvas id="sensorChart"></canvas>
                </div>
            </div>
        </div>

        <div id="relatorios" class="content">
            <h1>Relatórios</h1>
            <div id="lista-relatorios"></div> 
             <button class="add-report-btn" onclick="abrirRelatorio()">+ </button>
        </div>

        <div id="previsao" class="content previsao-container">
            <h1>Previsão do Nível do Rio</h1>
            <div class="previsao-card">
            <h3>Estação 001</h3>
            <p>Nível Previsto</p>
            <strong id="valor-previsao">Aguardando...</strong>
            </div>
        </div>
    </div>

    <div id="report-modal" class="modal">
        <div class="report-window">
            <div class="report-header">
                <button class="cancel-btn" onclick="fecharRelatorio()">Cancelar</button>
            </div>
            <div class="report-body">
                <label>Nome:</label>
                <input type="text" id="nome" name="nome">
                <label>Instituição vinculada:</label>
                <input type="text" id="instituicao" name="instituicao">
                <label>Situação:</label>
                <input type="text" id="situacao" name="situacao">
                <label>Documentação:</label>
                <textarea id="documentacao" name="documentacao"></textarea>
                <div class="save-area">
                    <button class="save-btn" onclick="salvarRelatorio()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <script type="module" src="js/app.js"></script> 
    <script type="module" src="js/prev.js"></script>

</body>
</html>
