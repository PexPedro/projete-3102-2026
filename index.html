<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>ARGOS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-page"> 
        <div class="login-box"> 
            <h1 id="titulo">Configuração de Acesso</h1>

            <input
                type="text"
                id="username"
                placeholder="Usuário"
            > 

            <input
                type="password"
                id="password"
                placeholder="Senha"
            > 

            <button onclick="login()">
                Entrar 
            </button>
        </div>
    </div>

    <div id="map-page" style="display:none;"> 

        <div class="navbar"> 

            <button class="tab active"
                    onclick="openTab('map')">
                Mapa 
            </button>

            <button class="tab"
                    onclick="openTab('alertas')">
                Alertas 
            </button>

            <button class="tab"
                    onclick="openTab('historico')">
                Histórico 
            </button>

            <button class="tab"
                    onclick="openTab('diagnostico')">
                Diagnóstico de Rede 
            </button>

            <button class="tab"
                    onclick="openTab('relatorios')">
                Relatórios 
            </button>

        </div>

        <div id="map" class="content active-content">

            <div id="mapa-regiao"></div>

                <div class="legend-box">

                    <h3>Legenda</h3>

                    <div class="legend-item">
                        <span class="legend-icon station"></span>
                        <span>Estação</span>
                    </div>

                    <div class="legend-item">
                        <span class="legend-icon condition"></span>
                        <span>Condição</span>
                    </div>

                    <div class="legend-item">
                        <span class="legend-icon flow"></span>
                        <span>Fluxo</span>
                    </div>

                </div>

        </div>

        <div id="alertas" class="content">
            <h1>Alertas</h1> 
        </div>

        <div id="historico" class="content">
            <h1>Histórico</h1> 
        </div>

        <div id="diagnostico" class="content">
            <h1>Diagnóstico de Rede</h1> 
        </div>

        <div id="relatorios" class="content">

            <h1>Relatórios</h1>

            <div id="lista-relatorios"></div>

            <button
                class="add-report-btn"
                onclick="abrirRelatorio()">
                +
            </button>

        </div>

    </div>
    
    <div id="report-modal" class="modal">

        <div class="report-window">

            <div class="report-header">

                <button
                    class="cancel-btn"
                    onclick="fecharRelatorio()">
                    Cancelar
                </button>

            </div>

            <div class="report-body">

                <label>Nome:</label>
                <input type="text" id="nome">

                <label>Instituição vinculada:</label>
                <input type="text" id="instituicao">

                <label>Situação:</label>
                <input type="text" id="situacao">

                <label>Documentação:</label>

                <textarea id="documentacao"></textarea>

                <div class="save-area">

                    <button
                        class="save-btn"
                        onclick="salvarRelatorio()">
                        Salvar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"> </script>
    <script src="estrutura.js"></script> 

</body>
</html>
