<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGOS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css"> 
</head>

<body>

    <div id="map-page" style="display:flex;"> 
        <div class="navbar"> 
            <button class="tab active" onclick="openTab('map', event)">
                Mapa 
            </button>
            <button class="tab" onclick="openTab('analise', event)">
                Análise Gráfica
            </button>
            <button class="tab" onclick="openTab('relatorios', event)">
                Relatórios 
            </button>
        </div>

        <div id="map" class="content active-content">
            <div id="mapa-regiao"></div>
            <div id="painel-estacao" class="painel-estacao">
                <div class="painel-estacao-header">
                    <h2 id="titulo-estacao">Estação</h2>
                    <button id="fechar-painel-estacao" class="fechar-painel" type="button" aria-label="Fechar informações">&times;</button>
                </div>
                <div class="estacao-leituras">
                    <p><span>Temperatura</span><strong id="temperatura-estacao">--</strong></p>
                    <p><span>Umidade</span><strong id="umidade-estacao">--</strong></p>
                    <p><span>Pluviometria</span><strong id="pluviometria-estacao">--</strong></p>
                    <p><span>Nível do rio</span><strong id="nivel-rio-estacao">--</strong></p>
                </div>
                <div class="estacao-alertas">
                    <div class="alertas-titulo"><span>Alertas</span><strong id="alertas-estacao">0</strong></div>
                    <div id="lista-alertas">Nenhum alerta no momento.</div>
                </div>
            </div>
        </div>

        <div id="analise" class="content">
            <h1>Análise Gráfica</h1>
            <div class="analysis-container">
                <div class="analysis-sidebar">
                    <h2>Variáveis</h2>
                    <label><input type="checkbox" checked onchange="toggleDataset(0)"> Temperatura</label>
                    <label><input type="checkbox" checked onchange="toggleDataset(1)"> Umidade</label>
                    <label><input type="checkbox" checked onchange="toggleDataset(2)"> Pluviometria</label>
                    <label><input type="checkbox" checked onchange="toggleDataset(3)"> Nível do Rio</label>
                    <div class="chart-controls">
                        <button class="chart-btn" onclick="resetChartZoom()">Reset Zoom</button>
                    </div>
                </div>

                <div class="analysis-chart">
                    <canvas id="sensorChart"></canvas>
                </div>
            </div>
        </div>

        <div id="relatorios" class="content">
            <h1>Relatórios</h1>
            <div id="lista-relatorios"></div> 
             <button class="add-report-btn" onclick="abrirRelatorio()">+ </button>
        </div>
    </div>

    <div id="report-modal" class="modal">
        <div class="report-window">
            <div class="report-header">
                <button class="cancel-btn" onclick="fecharRelatorio()">Cancelar</button>
            </div>
            <div class="report-body">
                <label>Nome:</label>
                <input type="text" id="nome" name="nome">
                <label>Instituição vinculada:</label>
                <input type="text" id="instituicao" name="instituicao">
                <label>Situação:</label>
                <input type="text" id="situacao" name="situacao">
                <label>Documentação:</label>
                <textarea id="documentacao" name="documentacao"></textarea>
                <div class="save-area">
                    <button class="save-btn" onclick="salvarRelatorio()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bibliotecas Externas -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <!-- Modificado: Aponta para a pasta js e carrega como módulo -->
    <script type="module" src="js/app.js"></script> 

</body>
</html>
